<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #f1f5f9;
    }

    .btn-ingest {
      background: #1e3a8a;
      color: #bfdbfe;
      border: 1px solid #1d4ed8;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-ingest:hover:not(:disabled) {
      background: #1d4ed8;
      color: #eff6ff;
    }

    .btn-ingest:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: #2d3f55; border-radius: 3px; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      font-size: 0.9375rem;
      pointer-events: none;
      user-select: none;
    }

    /* ── Message rows ── */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9375rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: #1e3a8a;
      color: #dbeafe;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    /* ── Confidence badge ── */
    .confidence-badge {
      margin-top: 5px;
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 9px;
      border-radius: 9999px;
    }

    .badge-high   { background: #14532d; color: #86efac; }
    .badge-medium { background: #78350f; color: #fde68a; }
    .badge-low    { background: #7f1d1d; color: #fca5a5; }

    /* ── Sources ── */
    .sources {
      margin-top: 6px;
      font-size: 0.8rem;
    }

    .sources-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #64748b;
      cursor: pointer;
      user-select: none;
      transition: color 0.12s;
    }

    .sources-toggle:hover { color: #94a3b8; }

    .sources-toggle .arrow {
      font-size: 0.6rem;
      transition: transform 0.15s;
    }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
      padding-left: 10px;
      border-left: 2px solid #293548;
    }

    .sources-list.open { display: flex; }

    .source-item a {
      color: #60a5fa;
      text-decoration: none;
    }

    .source-item a:hover { text-decoration: underline; }

    .source-item .src-date {
      color: #475569;
      margin-left: 7px;
    }

    /* ── Typing indicator ── */
    .typing-row {
      align-self: flex-start;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #475569;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
      30%           { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Input bar ── */
    .input-bar {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 14px 24px;
      border-top: 1px solid #1e293b;
    }

    .input-text {
      flex: 1;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9375rem;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    .input-text::placeholder { color: #475569; }
    .input-text:focus { border-color: #3b82f6; }

    .input-text::-webkit-scrollbar { width: 4px; }
    .input-text::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .btn-send {
      background: #1e3a8a;
      color: #bfdbfe;
      border: 1px solid #1d4ed8;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      align-self: flex-end;
    }

    .btn-send:hover:not(:disabled) {
      background: #1d4ed8;
      color: #eff6ff;
    }

    .btn-send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Nexus</h1>
    <button class="btn-ingest" id="btn-ingest">Ingest Papers</button>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="empty-state" id="empty-state">Ask Nexus anything about your papers.</div>
  </div>

  <div class="input-bar">
    <textarea class="input-text" id="input-text" placeholder="Ask a question…" rows="1"></textarea>
    <button class="btn-send" id="btn-send">Send</button>
  </div>

<script>
  const chatArea  = document.getElementById('chat-area');
  const inputText = document.getElementById('input-text');
  const btnSend   = document.getElementById('btn-send');
  const btnIngest = document.getElementById('btn-ingest');
  const emptyState = document.getElementById('empty-state');

  // Conversation history: [{role, content}, ...]
  let history = [];
  let busy = false;

  // ── Auto-resize textarea ──────────────────────────────────────
  inputText.addEventListener('input', () => {
    inputText.style.height = 'auto';
    inputText.style.height = Math.min(inputText.scrollHeight, 120) + 'px';
  });

  // Enter to send; Shift+Enter for newline
  inputText.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  btnSend.addEventListener('click', sendMessage);
  btnIngest.addEventListener('click', ingestPapers);

  // ── Helpers ───────────────────────────────────────────────────
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function scrollBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function setDisabled(state) {
    inputText.disabled = state;
    btnSend.disabled   = state;
    btnIngest.disabled = state;
    busy = state;
  }

  // ── Render helpers ────────────────────────────────────────────
  function badgeHtml(confidence) {
    if (confidence == null) return '';
    let cls, label;
    if (confidence >= 0.75) {
      cls = 'badge-high';   label = 'High confidence';
    } else if (confidence >= 0.50) {
      cls = 'badge-medium'; label = 'Medium confidence';
    } else {
      cls = 'badge-low';    label = 'Low confidence — verify sources';
    }
    return `<span class="confidence-badge ${cls}">${label}</span>`;
  }

  function sourcesHtml(sources) {
    if (!sources || sources.length === 0) return '';
    const uid = 'src-' + Math.random().toString(36).slice(2);
    const items = sources.map(s => {
      const title = esc(s.title || 'Untitled');
      const url   = esc(s.url || '#');
      const date  = s.date ? `<span class="src-date">${esc(s.date)}</span>` : '';
      return `<div class="source-item"><a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>${date}</div>`;
    }).join('');
    return `
      <div class="sources">
        <span class="sources-toggle" onclick="toggleSrc('${uid}', this)">
          <span class="arrow">&#9654;</span>
          ${sources.length} source${sources.length !== 1 ? 's' : ''}
        </span>
        <div class="sources-list" id="${uid}">${items}</div>
      </div>`;
  }

  function toggleSrc(uid, toggle) {
    const list  = document.getElementById(uid);
    const arrow = toggle.querySelector('.arrow');
    if (!list) return;
    const open = list.classList.toggle('open');
    arrow.style.transform = open ? 'rotate(90deg)' : '';
  }

  // ── Message rendering ─────────────────────────────────────────
  function appendUserMessage(text) {
    emptyState.style.display = 'none';
    const el = document.createElement('div');
    el.className = 'message user';
    el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function appendAssistantMessage(text, confidence, sources) {
    const el = document.createElement('div');
    el.className = 'message assistant';
    el.innerHTML = `
      <div class="bubble">${esc(text)}</div>
      ${badgeHtml(confidence)}
      ${sourcesHtml(sources)}
    `;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'message typing-row';
    el.id = 'typing-row';
    el.innerHTML = `<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    chatArea.appendChild(el);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById('typing-row')?.remove();
  }

  // ── Send message ──────────────────────────────────────────────
  async function sendMessage() {
    if (busy) return;
    const text = inputText.value.trim();
    if (!text) return;

    inputText.value = '';
    inputText.style.height = 'auto';
    appendUserMessage(text);

    // Build payload with last 6 history turns before this message
    const payload = {
      message: text,
      history: history.slice(-6)
    };

    // Persist user turn
    history.push({ role: 'user', content: text });

    setDisabled(true);
    showTyping();

    try {
      const res = await fetch('http://localhost:8000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      removeTyping();

      if (!res.ok) {
        const errBody = await res.text().catch(() => res.statusText);
        const msg = `Error ${res.status}: ${errBody}`;
        appendAssistantMessage(msg, null, null);
        history.push({ role: 'assistant', content: msg });
      } else {
        const data = await res.json();
        const answer     = data.answer ?? data.message ?? JSON.stringify(data);
        const confidence = data.confidence ?? null;
        const sources    = data.sources    ?? null;
        appendAssistantMessage(answer, confidence, sources);
        history.push({ role: 'assistant', content: answer });
      }
    } catch (err) {
      removeTyping();
      const msg = `Could not reach the server: ${err.message}`;
      appendAssistantMessage(msg, null, null);
    }

    setDisabled(false);
    inputText.focus();
  }

  // ── Ingest papers ─────────────────────────────────────────────
  async function ingestPapers() {
    if (busy) return;
    btnIngest.disabled = true;
    btnIngest.textContent = 'Ingesting…';

    try {
      const res = await fetch('http://localhost:8000/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });

      if (!res.ok) {
        const errBody = await res.text().catch(() => res.statusText);
        alert(`Ingest failed (${res.status}): ${errBody}`);
      } else {
        const data = await res.json();
        const count = data.count ?? data.papers_added ?? data.added ?? '?';
        alert(`Done — ${count} papers added to Nexus`);
      }
    } catch (err) {
      alert(`Could not reach the server: ${err.message}`);
    }

    btnIngest.disabled = false;
    btnIngest.textContent = 'Ingest Papers';
  }
</script>
</body>
</html>
